name: Frontend
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm api:generate && git diff --exit-code src/lib/api-schema.ts
        working-directory: frontend
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          PORT=3001 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/terralens-frontend.log 2>&1 &
        working-directory: frontend
      - name: Wait for production server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/terralens-frontend.log
          exit 1
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-e2e
          path: frontend/playwright-report
