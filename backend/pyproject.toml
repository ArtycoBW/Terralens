[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terralens-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "terralens-ml", "Django>=5.2,<5.3", "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.5,<6",
  "httpx>=0.28,<1", "shapely>=2.1,<3", "pyproj>=3.7,<4", "rasterio>=1.4,<2",
  "gunicorn>=23,<24", "dj-database-url>=2.3,<4"
]

[tool.uv.sources]
terralens-ml = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["config", "apps", "providers", "services"]
