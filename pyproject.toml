[project]
name = "terralens"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["terralens-ml", "terralens-backend"]

[tool.uv.workspace]
members = ["ml", "backend"]

[tool.uv.sources]
terralens-ml = { workspace = true }
terralens-backend = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-django>=4.11,<5", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
pythonpath = ["backend"]
DJANGO_SETTINGS_MODULE = "config.settings"
markers = ["integration: requires PostgreSQL/PostGIS", "live: makes external provider requests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
