<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
<title id="title">TerraLens — контейнерная архитектура</title><desc id="desc">Браузер обращается к Next.js и Django. Redis доставляет задания worker, который получает внешние данные, использует ML и сохраняет результат в PostGIS и файловом хранилище. Автономный CLI работает отдельно.</desc>
