input: train-dataset.zip
output: artifacts/research
artifact_output: ml/artifacts/final
prior_split: docs/analysis/baseline/split_manifest.json
seed: 42
folds: 5
mask_seeds: [42, 137]
mask_fraction: 0.15
calibration_fields: 5
assessment_fields: 5
calibration_level: 0.9
max_gap_days: 60
max_edge_days: 14
season_start_month: 1
boost_iterations: 160
candidates:
  m0: {algorithm: neighbor_mean}
  m1: {algorithm: linear}
  m2: {algorithm: pchip}
  m3: {algorithm: robust_smoother}
  m3_without_robust: {algorithm: robust_smoother, robust: false}
  m3_raw: {algorithm: robust_smoother, quality_filter: false}
  m4: {algorithm: history_residual}
  m4_without_history: {algorithm: history_residual, use_history: false}
  m5: {algorithm: catboost_residual}
  m5_without_weather: {algorithm: catboost_residual, use_weather: false}
  m5_without_sensors: {algorithm: catboost_residual, use_sensors: false}
  m0_raw: {algorithm: neighbor_mean, quality_filter: false}
  m0_clip: {algorithm: neighbor_mean, clip: true}
