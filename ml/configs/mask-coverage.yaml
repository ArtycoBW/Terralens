input: train-dataset.zip
output: artifacts/mask-coverage
artifact_output: artifacts/mask-coverage/model
prior_split: docs/analysis/baseline/split_manifest.json
seed: 42
folds: 5
mask_seeds: [42, 137]
mask_fraction: 0.15
calibration_fields: 5
assessment_fields: 5
calibration_level: 0.9
max_gap_days: 60
max_edge_days: 14
season_start_month: 1
selection_baseline: current
assessment_status: Previously inspected assessment and temporal scopes; reused diagnostics only, never used to select these candidates
candidates:
  current: &current
    algorithm: catboost_residual
    use_weather: false
    local_features: true
    masked_training_priors: true
    boost_iterations: 400
    training_repeats: 3
    training_blocks: true
  random_6:
    <<: *current
    training_repeats: 6
  cover_5: &cover
    <<: *current
    training_repeats: 5
    cover_training_targets: true
  cover_quality:
    <<: *cover
    context_quality: true
  cover_depth5:
    <<: *cover
    boost_depth: 5
  cover_depth6:
    <<: *cover
    boost_depth: 6
  cover_quality_depth5:
    <<: *cover
    context_quality: true
    boost_depth: 5
  cover_regularized:
    <<: *cover
    boost_depth: 5
    boost_l2: 20
